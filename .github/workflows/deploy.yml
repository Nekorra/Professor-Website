# ---------------------------------------------------------------------------
# Build & Deploy the Angular site to GitHub Pages (gh-pages branch)
#
# This powers the live UC Davis site: https://houman.ece.ucdavis.edu/
#
# REQUIRED GitHub repo Secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_API_KEY
#   FIREBASE_AUTH_DOMAIN
#   FIREBASE_DATABASE_URL
#   FIREBASE_PROJECT_ID
#   FIREBASE_STORAGE_BUCKET
#   FIREBASE_MESSAGING_SENDER_ID
#   FIREBASE_APP_ID
#   FIREBASE_MEASUREMENT_ID
#
# These are written to a .env file at build time so scripts/generate-env.js can
# generate src/environments/environment*.ts. The Firebase web config is public
# by design (security is enforced by database.rules.json / storage.rules), but
# we still source it from Secrets so it never has to live in the repo.
#
# GitHub Pages setup (one-time):
#   - Settings -> Pages -> "Build and deployment" -> Source: "Deploy from a branch"
#   - Branch: gh-pages  /  (root)
#   - Custom domain: houman.ece.ucdavis.edu  (this workflow re-writes the CNAME
#     file on every deploy via the `cname` option below, so the custom domain
#     survives each publish).
# ---------------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deploys; cancel an in-progress run if a newer push lands.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate .env from repo Secrets
        run: |
          cat > .env <<EOF
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          EOF

      - name: Build (production)
        run: npm run build:prod -- --base-href /

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/Houman-Homayoun-Website
          publish_branch: gh-pages
          cname: houman.ece.ucdavis.edu
