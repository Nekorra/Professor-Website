<div class="students-page">
  <section class="page-hero">
    <div class="container">
      <p class="page-hero__eyebrow">People</p>
      <h1 class="page-hero__title">Students &amp; Alumni</h1>
      <p class="page-hero__subtitle">
        The researchers, engineers, and scholars who drive the lab's work &mdash;
        current members and alumni across every degree program.
      </p>
    </div>
  </section>

  <section
    class="section"
    *ngFor="let section of sections; let i = index"
    [class.section--muted]="i % 2 === 1"
  >
    <div class="container">
      <div class="section__header reveal">
        <h2 class="section-title">{{ section.label }}</h2>
        <span class="badge" *ngIf="section.people.length">{{ section.people.length }}</span>
      </div>

      <ng-container *ngIf="section.people.length">
        <ul class="name-list reveal" *ngIf="isNameOnlySection(section); else peopleGrid">
          <li class="name-list__item" *ngFor="let person of section.people">{{ displayName(person) }}</li>
        </ul>

        <ng-template #peopleGrid>
          <div class="people-grid reveal">
            <figure class="person-card" *ngFor="let person of section.people">
              <div class="person-card__avatar">
                <img
                  *ngIf="hasPhoto(person); else noPhoto"
                  [src]="person.img_name"
                  [alt]="person.name"
                  class="person-card__image"
                  loading="lazy"
                />
                <ng-template #noPhoto>
                  <span class="person-card__initials" aria-hidden="true">{{ initials(person) }}</span>
                </ng-template>
              </div>
              <figcaption class="person-card__info">
                <span class="person-card__name">{{ displayName(person) }}</span>
                <span class="person-card__role" *ngIf="getSubtitle(person)">{{ getSubtitle(person) }}</span>
              </figcaption>
            </figure>
          </div>
        </ng-template>
      </ng-container>
    </div>
  </section>

  <section class="section" *ngIf="!sections.length">
    <div class="container">
      <p class="empty-state">No student records to display.</p>
    </div>
  </section>
</div>
